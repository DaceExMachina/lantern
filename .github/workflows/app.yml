# Publishing a GitHub release builds Lantern.app and attaches it as Lantern.zip (release.yml calls it for one-click releases).
# It's signed ad hoc, with no Developer ID or notarization, so the first launch needs System Settings > Privacy & Security >
# Open Anyway.
name: Lantern.app
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag: { type: string, default: '' } # the release to attach the zip to; empty builds it without uploading
permissions:
  contents: write
jobs:
  app:
    runs-on: macos-latest # Apple silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build # app/build.sh packs dist/ into the app
      - run: sh app/build.sh "$RUNNER_TEMP/apps"
      - run: ditto -c -k --keepParent app/build/Lantern.app Lantern.zip # ditto keeps the signature intact
      - if: inputs.tag || github.event.release.tag_name
        run: gh release upload "${{ inputs.tag || github.event.release.tag_name }}" Lantern.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
