name: check
on: [pull_request]
jobs:
  types:
    runs-on: macos-latest # package.json says os: darwin, so npm ci refuses on Linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run check
