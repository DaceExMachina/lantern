name: check
on:
  pull_request:
  push:
    branches: [main] # sessions push small fixes straight to main, so check those too
jobs:
  types:
    runs-on: macos-latest # package.json says os: darwin, so npm ci refuses on Linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm test # builds the Swift server headless and replays hook events against it
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lantern.app compiles
        run: swiftc -typecheck app/main.swift app/Server.swift app/Stats.swift
      - name: The screensaver compiles
        run: swiftc -typecheck screensaver/LanternView.swift
