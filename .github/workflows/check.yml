name: check
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled] # labeled: add the run-ci label to a PR to run the checks again
  push:
    branches: [main] # sessions push small fixes straight to main, so check those too
permissions:
  contents: read
jobs:
  # takes the run-ci label straight back off, so adding it again triggers another run
  unlabel:
    if: github.event.action == 'labeled' && github.event.label.name == 'run-ci'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - run: gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --remove-label run-ci
        env:
          GH_TOKEN: ${{ github.token }}
  types:
    if: github.event.action != 'labeled' || github.event.label.name == 'run-ci'
    runs-on: macos-latest # package.json says os: darwin, so npm ci refuses on Linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm } # Vite needs 20.19 or 22.12 and up
      - run: npm ci
      - run: npm run build
      - run: npm run check # vue-tsc
      - run: npm test # node:test (builds the Swift server headless and replays hook events against it), then vitest run
  swift:
    if: github.event.action != 'labeled' || github.event.label.name == 'run-ci'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lantern.app compiles
        run: swiftc -typecheck app/*.swift
      - name: The screensaver compiles
        run: swiftc -typecheck screensaver/LanternView.swift
