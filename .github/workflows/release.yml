# Every night, if anything the app ships has changed on main since the latest release, cut the next patch release
# with GitHub's generated notes and attach Lantern.zip. Run it by hand from the Actions tab to release right away.
# A dry run, or a run on any branch but main, builds the zip and publishes nothing.
name: release
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the zip but don't publish a release
        type: boolean
        default: false
permissions:
  contents: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      publish: ${{ steps.next.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: next
        run: |
          last=$(git tag -l 'v*' --sort=-v:refname | head -1)
          # what app/build.sh puts in the app; docs, tests and tooling don't need a release
          if git diff --quiet "$last" HEAD -- app page index.html 'icon*'; then
            echo "Nothing the app ships has changed since $last"
            exit 0
          fi
          tag=${last%.*}.$((${last##*.} + 1))
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Changes since $last, so the next release is $tag (publish: $PUBLISH)"
          git diff --stat "$last" HEAD -- app page index.html 'icon*'
        env:
          PUBLISH: ${{ github.ref == 'refs/heads/main' && inputs.dry_run != true }}
      - if: steps.next.outputs.publish == 'true'
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "Lantern ${TAG#v}" --generate-notes
        env:
          TAG: ${{ steps.next.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
  # a release made with GITHUB_TOKEN doesn't fire app.yml's release event, so call it directly
  app:
    needs: release
    if: needs.release.outputs.tag
    uses: ./.github/workflows/app.yml
    with:
      tag: ${{ needs.release.outputs.publish == 'true' && needs.release.outputs.tag || '' }}
