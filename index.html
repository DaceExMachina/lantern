<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #1E1930; color: #C9B8DA; font: 14px/1.4 system-ui, sans-serif; }
  body { display: grid; grid-template-rows: minmax(0, 1fr) auto; }
  svg { width: 100%; height: 100%; display: block; }
  footer { display: flex; gap: 16px; justify-content: center; align-items: center; padding: 12px 16px; flex-wrap: wrap; }
  #status.waiting { color: #B9A8FF; }
  #status.offline { color: #8A7A99; font-style: italic; }
  /* compact layout for iTerm2's toolbelt panel (opened with ?panel) */
  .panel footer { font-size: 11px; gap: 4px 10px; padding: 6px 8px; }
  .panel #card { max-width: 210px; font-size: 11.5px; }
  .panel .notify { display: none; }
  /* screensaver mode (opened with ?screensaver): just the scene, with the glow running to the screen's edges */
  body.screensaver { background: #2B2440; cursor: none; }
  .screensaver footer, .screensaver #card, .screensaver #frame { display: none; }
  /* ambient (a second display's screensaver): just the colour and the drifting specks */
  .ambient #lantern, .ambient #moths, .ambient #threads, .ambient #rings, .ambient #glow, .ambient #rays { display: none; }
  label { cursor: pointer; user-select: none; }
  #threads path { animation: shimmer 2.4s linear infinite; }
  @keyframes shimmer { to { stroke-dashoffset: -18; } }
  .moth { cursor: pointer; }
  select { font: inherit; color: inherit; background: #2B2440; border: 1px solid #4A3B68; border-radius: 6px; padding: 2px 6px; }
  #card { position: fixed; left: 0; top: 0; pointer-events: none; opacity: 0; transition: opacity .15s; max-width: 300px;
    background: rgba(30, 24, 46, .92); border: 1px solid #4A3B68; border-radius: 10px; padding: 10px 12px; color: #D8CCE6;
    font-size: 12.5px; line-height: 1.45; box-shadow: 0 8px 28px rgba(0,0,0,.45); backdrop-filter: blur(6px); }
  #card.show { opacity: 1; }
  #card h3 { margin: 0 0 4px; font-size: 14px; color: #F5E9FF; display: flex; gap: 8px; align-items: center; }
  #card h3 { align-items: flex-start; }
  #card .chip { white-space: nowrap; flex-shrink: 0; margin-top: 2px; font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 99px; background: #4A3B58; color: #F2DCC0; }
  #card .chip.waiting { background: #5B44C9; color: #F0ECFF; }
  #card .chip.idle { background: #3A3050; color: #B9A8C8; }
  #card .chip.paused { background: #33405E; color: #C4D2F0; }
  #card .note { color: #C3B2FF; font-weight: 500; }
  #card .prompt { font-style: italic; color: #E8DCF2; overflow-wrap: anywhere; }
  #card .dim { color: #8F7FA6; overflow-wrap: anywhere; }
  #card div + div { margin-top: 3px; }
  .moth .wing { fill: var(--wing); stroke: var(--edge); stroke-width: 1.2; }
</style>
</head>
<body>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const CX = 340, CY = 330, FLAME_BASE = 388;
// the original two-petal moth, split into its wings as absolute quadratic curves from the joint at 0,0
const WING_UP = [[0, 0], [-14, -12], [-2, -18], [6, -14], [0, 0]];
const WING_SIDE = [[0, 0], [12, -14], [18, -4], [14, 6], [0, 0]];
// both wings hinge on the body axis, the line between them (they point at about -96° and -12.5°)
const AXIS = -54.4 * Math.PI / 180, AU = [Math.cos(AXIS), Math.sin(AXIS)], AN = [-Math.sin(AXIS), Math.cos(AXIS)];
const EYE = 40; // viewer distance in moth units: smaller means stronger perspective

// Flap a wing up toward the viewer by `lift` radians around the body axis, sweep it forward a little as it rises,
// and project it with perspective so the tip swells as it comes closer while the joint stays put.
// `roll` turns the whole moth around its body axis: 0 is seen from above, ±90° is fully side-on,
// where both wings overlap and swing toward and away from the viewer.
function flapWing(pts, lift, sweep, roll = 0) {
  return pts.map(([x, y]) => {
    const a = x * AU[0] + y * AU[1], r = x * AN[0] + y * AN[1];
    const z = Math.abs(r) * Math.sin(lift), r2 = r * Math.cos(lift), a2 = a + sweep * z;
    const across = r2 * Math.cos(roll) + z * Math.sin(roll), depth = z * Math.cos(roll) - r2 * Math.sin(roll), k = EYE / (EYE - depth);
    return [(a2 * AU[0] + across * AN[0]) * k, (a2 * AU[1] + across * AN[1]) * k];
  });
}
// Landed, the wings fold together straight up, so from the side we see a single wing standing off the lantern
// with the joint against the paper: the upper petal turned to point along `deg`.
const UP_TIP = -96.3;
function foldedWing(deg, scale, squash = 1) {
  const a = -UP_TIP * Math.PI / 180, b = deg * Math.PI / 180;
  return WING_UP.map(([x, y]) => {
    // lay the petal along +x, shorten it (foreshortening), then turn it to point along `deg`
    const u = (x * Math.cos(a) - y * Math.sin(a)) * squash * scale, v = (x * Math.sin(a) + y * Math.cos(a)) * scale;
    return [u * Math.cos(b) - v * Math.sin(b), u * Math.sin(b) + v * Math.cos(b)];
  });
}
const mixPts = (a, b, t) => a.map(([x, y], i) => [x + (b[i][0] - x) * t, y + (b[i][1] - y) * t]);
const pathOf = p => { const f = ([x, y]) => `${x.toFixed(2)} ${y.toFixed(2)}`; return `M${f(p[0])}Q${f(p[1])} ${f(p[2])}Q${f(p[3])} ${f(p[4])}Z`; };
// big moths for sessions, medium for supervisor agents, small for plain subagents
const SIZE = { session: 1.4, supervisor: 0.9, subagent: 0.55 };
// where session moths live, clear of the lantern; each session keeps its spot and wanders around it
const HOMES = [[150,170],[530,160],[115,390],[565,385],[190,550],[490,555],[245,85],[435,85]];
const EDGES = [[20,80],[660,140],[30,600],[660,560],[340,-20],[-20,330],[700,330]];

// The scene is designed on a 600x600 square around the lantern. To fill any window shape, the visible area grows
// wider or taller (the lantern keeps its size), and positions laid out on the square stretch with it.
const VIEW = { kx: 1, ky: 1 };
const stretch = ([x, y]) => [340 + (x - 340) * VIEW.kx, 320 + (y - 320) * VIEW.ky];
function fitView() {
  const svg = document.querySelector('svg'), { width, height } = svg.getBoundingClientRect();
  if (!width || !height) return;
  VIEW.kx = Math.max(1, width / height); VIEW.ky = Math.max(1, height / width);
  const w = 600 * VIEW.kx, h = 600 * VIEW.ky, x = 340 - w / 2, y = 320 - h / 2;
  svg.setAttribute('viewBox', `${x} ${y} ${w} ${h}`);
  Object.entries({ x, y, width: w, height: h }).forEach(([k, v]) => $('frame').setAttribute(k, v));
}
addEventListener('resize', fitView);

// which lantern is shared by every window (Dock app, iTerm panel, screensaver): the server keeps it in settings.json
let style = STYLES.barrel;
function applyStyle(key) {
  style = STYLES[key] || STYLES.barrel;
  const [fx, fy, fk] = style.flame;
  $('lantern').innerHTML = style.back
    + `<g ${style.paper ? 'filter="url(#behindPaper)"' : ''} transform="translate(${fx} ${fy}) scale(${fk}) translate(-340 -${FLAME_BASE})">${FLAME}</g>`
    + style.front;
  for (const m of moths.values()) m.wasLanded = false; // landed moths find new spots on the new lantern
  $('style').value = key;
}

// Somewhere on the lantern's surface: a random height, and a random way round from near the middle to the edge.
// The wing points straight out of the surface; seen from the front its sideways part shrinks toward the middle,
// so moths there show a shorter wing. Returns [x, y, wing angle, wing length].
function pickPerch(side = Math.random() < 0.5 ? -1 : 1) {
  const { top, bottom, half } = style.body;
  const y = top + (bottom - top) * (0.06 + Math.random() * 0.88);
  const sin = Math.sin((15 + Math.random() * 75) * Math.PI / 180);
  const slope = (half(y + 1) - half(y - 1)) / 2, len = Math.hypot(1, slope); // how fast the surface bulges at this height
  const px = side / len * sin, py = -slope / len; // the surface's outward direction, as seen from the front
  return [340 + side * half(y) * sin, y, Math.atan2(py, px) * 180 / Math.PI, Math.max(0.3, Math.hypot(px, py))];
}

// warm = everyone busy, cool = someone needs me; everything crossfades between the two
const WARM = { halo: '#FF9F45', outer: '#F7913F', mid: '#FFC266', core: '#FFF4D6', base: '#6C8CFF', glow: '#F7B267',
  paper: '#FFB85C', thread: '#E8B48A', rings: ['#3A3050', '#4A3B58', '#6A4A58'] };
const COOL = { halo: '#8C6CFF', outer: '#7A63F0', mid: '#9FB6FF', core: '#F0F2FF', base: '#D2B4FF', glow: '#9D7CF5',
  paper: '#A99BFF', thread: '#B6A6F5', rings: ['#2E2E58', '#3A3A6E', '#4E4A86'] };
const MOTH_IDLE = '#E9DCF0', MOTH_CALL = '#7B5CFF';

const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, t) => '#' + hex(a).map((v, i) => Math.round(v + (hex(b)[i] - v) * t).toString(16).padStart(2, '0')).join('');
// cheap smooth noise: a few sines at unrelated frequencies
const wobble = (s, k) => Math.sin(s * 2.3 + k) * 0.6 + Math.sin(s * 5.1 + k * 1.7) * 0.3 + Math.sin(s * 11.7 + k * 0.6) * 0.1;

let sessions = [];
const moths = new Map(); // key -> moth
let seenWaiting = new Set();

// ---- state from server -------------------------------------------------------
const es = new EventSource('/events');
es.onmessage = e => { sessions = JSON.parse(e.data); sync(); };
es.addEventListener('settings', e => { const key = JSON.parse(e.data).style; if (STYLES[key] && STYLES[key] !== style) applyStyle(key); });
es.onerror = () => { $('status').textContent = 'server offline, retrying…'; $('status').className = 'offline'; };

function sync() {
  const live = new Set();
  for (const s of sessions) {
    live.add(s.id);
    if (!moths.has(s.id)) moths.set(s.id, Object.assign(makeSessionMoth(s.id), { key: s.id }));
    moths.get(s.id).session = s;
    for (const a of s.subagents) {
      const k = s.id + '/' + a.id;
      live.add(k);
      if (!moths.has(k)) moths.set(k, Object.assign(makeSubMoth(k, s.id, /supervisor/i.test(a.type) ? SIZE.supervisor : SIZE.subagent), { key: k }));
      Object.assign(moths.get(k), { session: s, type: a.type });
    }
  }
  for (const [k, m] of moths) if (!live.has(k)) m.leaving = true;

  const working = sessions.filter(s => s.state === 'working').length;
  const onAgents = sessions.filter(s => s.state === 'paused').length;
  const waiting = sessions.filter(s => s.state === 'waiting' && !s.snoozed);
  const snoozed = sessions.filter(s => s.state === 'waiting' && s.snoozed).length;
  const st = $('status');
  st.className = waiting.length ? 'waiting' : '';
  st.textContent = sessions.length
    ? `${sessions.length} session${sessions.length > 1 ? 's' : ''} · ${working} working` + (onAgents ? ` · ${onAgents} waiting on agents` : '') + (waiting.length ? ` · ${waiting.length} need${waiting.length > 1 ? '' : 's'} you` : '') + (snoozed ? ` · ${snoozed} snoozed` : '')
    : 'quiet night, no sessions';

  for (const s of waiting) if (!seenWaiting.has(s.id)) alertMe(s);
  seenWaiting = new Set(waiting.map(s => s.id));
}

function el(tag, attrs = {}) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

function mothNode() {
  const g = el('g', { class: 'moth' });
  const up = el('path', { d: pathOf(WING_UP), class: 'wing' }), side = el('path', { d: pathOf(WING_SIDE), class: 'wing' });
  const wings = el('g', { transform: 'translate(-2 -6)' }); // same offset as the original artwork, so it pivots the same way
  wings.append(side, up);
  g.append(el('circle', { r: 18, fill: 'transparent' }), wings);
  $('moths').append(g);
  return { g, up, side };
}

// hovering a moth pins a card to it; a short grace period stops it flickering as the moth drifts
let hovered = null, hideTimer;
function hoverable(m) {
  m.g.addEventListener('pointerenter', () => { clearTimeout(hideTimer); hovered = m; renderCard(); });
  // clicking brings the session's iTerm tab to the front (a subagent focuses its parent session)
  m.g.addEventListener('click', () => fetch('/focus', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: m.parentId || m.key }) }));
  // right-click snoozes a session that's waiting on me (or wakes it): it rests on the lantern without turning it violet
  m.g.addEventListener('contextmenu', e => {
    e.preventDefault();
    const s = m.session;
    if (m.parentId || s?.state !== 'waiting') return;
    fetch('/snooze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: s.id, snoozed: !s.snoozed }) });
  });
  m.g.addEventListener('pointerleave', () => { hideTimer = setTimeout(() => { hovered = null; $('card').classList.remove('show'); }, 700); });
  return m;
}

function makeSessionMoth(key) {
  const taken = new Set([...moths.values()].filter(m => m.home && !m.leaving).map(m => m.slot));
  let slot = 0; while (taken.has(slot)) slot++;
  const [hx, hy] = HOMES[slot % HOMES.length];
  const spill = Math.floor(slot / HOMES.length) * 35; // more than 8 sessions: crowd in near an existing spot
  const [x, y] = stretch(EDGES[Math.floor(Math.random() * EDGES.length)]);
  const thread = el('path');
  $('threads').append(thread);
  return hoverable({ ...mothNode(), size: SIZE.session, slot, home: [hx + spill, hy + spill * 0.5], thread,
    x, y, phase: Math.random() * 10, perch: pickPerch(), cool: 0, leaving: false });
}

function makeSubMoth(key, parentId, size) {
  const p = moths.get(parentId);
  return hoverable({ ...mothNode(), size, parentId, x: p?.x ?? CX, y: p?.y ?? CY, a: Math.random() * 6.28,
    r: (size === SIZE.supervisor ? 54 : 38) + Math.random() * 14,
    speed: (1.1 + Math.random()) * (Math.random() < 0.5 ? -1 : 1) / size ** 0.5,
    phase: Math.random() * 10, cool: 0, leaving: false });
}

function flamePath(w, h, lean) {
  const bx = 340, by = FLAME_BASE, tx = bx + lean, ty = by - h, f = n => n.toFixed(1);
  return `M${f(bx - w * 0.55)} ${f(by - h * 0.14)}` +
    `C${f(bx - w * 1.05)} ${f(by - h * 0.45)} ${f(tx - w * 0.35 + lean * 0.2)} ${f(ty + h * 0.35)} ${f(tx)} ${f(ty)}` +
    `C${f(tx + w * 0.35 + lean * 0.2)} ${f(ty + h * 0.35)} ${f(bx + w * 1.05)} ${f(by - h * 0.45)} ${f(bx + w * 0.55)} ${f(by - h * 0.14)}` +
    `C${f(bx + w * 0.6)} ${f(by + h * 0.1)} ${f(bx - w * 0.6)} ${f(by + h * 0.1)} ${f(bx - w * 0.55)} ${f(by - h * 0.14)}Z`;
}

// soft light rays turning slowly in two layers, and dust drifting in the light
for (const [id, off] of [['raysA', 0], ['raysB', 0.35]]) for (let i = 0; i < 9; i++) {
  const a = i / 9 * Math.PI * 2 + off, w = 0.05 + (i % 3) * 0.025, p = t => `${(300 * Math.cos(t)).toFixed(1)} ${(300 * Math.sin(t)).toFixed(1)}`;
  $(id).append(el('path', { d: `M0 0L${p(a - w)}L${p(a + w)}Z`, fill: 'url(#rayGrad)' }));
}
const rayNodes = [...$('rays').querySelectorAll('path')];
const dust = Array.from({ length: 34 }, () => ({ a: Math.random() * 6.28, d: 40 + Math.random() * 230, w: (Math.random() - 0.5) * 0.12,
  ph: Math.random() * 10, n: $('dust').appendChild(el('circle', { r: (0.7 + Math.random() * 1.2).toFixed(2) })) }));
// a fainter, wider ring of specks out in the dark, beyond the glow
const farDust = Array.from({ length: 26 }, () => ({ a: Math.random() * 6.28, d: 230 + Math.random() * 110, w: (Math.random() - 0.5) * 0.08,
  ph: Math.random() * 10, n: $('dust').appendChild(el('circle', { r: (0.6 + Math.random() * 0.9).toFixed(2) })) }));

// the iTerm2 toolbelt opens the page with ?panel for a compact layout, the screensaver with ?screensaver
for (const mode of ['panel', 'screensaver', 'ambient']) if (new URLSearchParams(location.search).has(mode)) document.body.classList.add(mode);
fitView();

// lantern picker
for (const [key, st] of Object.entries(STYLES)) $('style').append(new Option(st.name, key, false, st === style));
$('style').onchange = e => {
  applyStyle(e.target.value);
  fetch('/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ style: e.target.value }) });
};
applyStyle('barrel'); // until the server says which lantern is chosen

// ---- animation ---------------------------------------------------------------
let level = 0, cool = 0, sparkClock = 0, last = performance.now();
const sparks = [];
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  const s = t / 1000;
  const working = sessions.filter(x => x.state === 'working' || x.state === 'paused').length; // agents still busy count too
  const calling = sessions.some(x => x.state === 'waiting' && !x.snoozed);
  level += (Math.min(working, 5) / 5 - level) * dt * 1.5; // 5+ working is "fully lit"
  cool += ((calling ? 1 : 0) - cool) * dt * 2;
  const pal = k => mix(WARM[k], COOL[k], cool);
  const pulse = 1 - 0.3 * cool * (0.5 + 0.5 * Math.sin(s * 2.4));
  const flick = 1 + wobble(s * 1.6, 3) * 0.06;

  // sway on the string; anything attached to the lantern goes through rot()
  const sway = Math.sin(s * 0.7) * 1.6 + Math.sin(s * 1.9) * 0.4, rad = sway * Math.PI / 180;
  const rot = (px, py) => [340 + (px - 340) * Math.cos(rad) - (py - 20) * Math.sin(rad), 20 + (px - 340) * Math.sin(rad) + (py - 20) * Math.cos(rad)];
  $('lantern').setAttribute('transform', `rotate(${sway.toFixed(2)} 340 20)`);
  if (style.tassel) $('tassel')?.setAttribute('transform', `rotate(${(Math.sin(s * 0.7 - 0.9) * 2.6 + Math.sin(s * 1.9 - 1.2) * 0.8).toFixed(2)} ${style.tassel[0]} ${style.tassel[1]})`);

  // flame: layered tongues that lean and stretch independently, ember-small when idle
  const size = 0.3 + 0.7 * Math.max(level, cool * 0.45);
  const layers = [['fHalo', 46, 118, 6, 1], ['fOuter', 34, 96, 9, 2], ['fMid', 24, 70, 6, 3], ['fCore', 13, 40, 3, 4]];
  for (const [id, w, h, lean, k] of layers) {
    const n = $(id);
    n.setAttribute('d', flamePath(w * (1 + wobble(s, k + 9) * 0.05), h * (1 + wobble(s * 1.3, k) * 0.08), wobble(s, k) * lean));
    n.setAttribute('fill', pal(id.slice(1).toLowerCase()));
  }
  $('fBase').setAttribute('fill', pal('base'));
  $('flame').setAttribute('transform', `translate(340 ${FLAME_BASE}) scale(${size.toFixed(3)}) translate(-340 -${FLAME_BASE})`);
  $('flame').setAttribute('opacity', pulse.toFixed(3));

  // embers float off the tip, more of them the busier things get
  sparkClock += dt * (0.4 + 5 * level);
  while (sparkClock > 1) {
    sparkClock--;
    sparks.push({ x: 340 + wobble(s, 2) * 6 * size, y: FLAME_BASE - 90 * size, vx: (Math.random() - 0.5) * 16, vy: -25 - Math.random() * 30, life: 1 });
  }
  for (const p of sparks) { p.x += p.vx * dt + Math.sin(s * 4 + p.vy) * 0.3; p.y += p.vy * dt; p.life -= dt * 0.8; }
  while (sparks.length && sparks[0].life <= 0) sparks.shift();
  $('sparks').replaceChildren(...sparks.map(p => el('circle', { cx: p.x.toFixed(1), cy: p.y.toFixed(1), r: (1.6 * p.life).toFixed(2), fill: pal('mid'), opacity: p.life.toFixed(2) })));

  // the light: lit paper, a breathing halo, and the rings tinting with the flame
  document.querySelectorAll('.paperStop').forEach(n => n.setAttribute('stop-color', pal('paper')));
  $('paperGlow')?.setAttribute('opacity', ((0.3 + 0.7 * size) * flick * pulse).toFixed(3));
  // the paper takes on the flame's colour, more so the brighter it burns
  $('paperTint')?.setAttribute('fill', pal('paper'));
  $('paperTint')?.setAttribute('opacity', ((0.25 + 0.45 * size) * flick * pulse).toFixed(3));
  document.querySelectorAll('.glowStop').forEach(n => n.setAttribute('stop-color', pal('glow')));
  const [gx, gy] = rot(...style.light);
  const breathe = Math.sin(s * 1.1) * 0.5 + 0.5;
  $('glow').setAttribute('cx', gx.toFixed(1)); $('glow').setAttribute('cy', gy.toFixed(1));
  $('glow').setAttribute('r', (150 + 90 * level + 25 * cool + 14 * breathe).toFixed(1));
  $('glow').setAttribute('opacity', ((0.12 + 0.45 * Math.max(level, cool * 0.6)) * flick * pulse).toFixed(3));
  [...$('rings').children].forEach((c, i) => c.setAttribute('fill', mix(WARM.rings[i], COOL.rings[i], cool)));
  // rings ripple outward: the inner ring swells first, the outer ones follow
  // ...and swing with the lantern, centred where its body hangs
  const [rx, ry] = rot(340, 330);
  [250, 190, 135].forEach((r, i) => {
    const c = $('rings').children[i];
    c.setAttribute('cx', rx.toFixed(1)); c.setAttribute('cy', ry.toFixed(1));
    c.setAttribute('r', (r * (0.88 + 0.12 * level) * (1 + 0.03 * Math.sin(s * 1.1 - (2 - i) * 0.9))).toFixed(1));
  });
  $('rings').setAttribute('opacity', (0.55 + 0.45 * Math.max(level, cool * 0.5)).toFixed(3));
  const strength = Math.max(level, cool * 0.6);
  document.querySelectorAll('.rayStop').forEach(n => n.setAttribute('stop-color', pal('glow')));
  $('rays').setAttribute('transform', `translate(${gx.toFixed(1)} ${gy.toFixed(1)}) scale(${Math.max(VIEW.kx, VIEW.ky).toFixed(2)})`);
  $('raysA').setAttribute('transform', `rotate(${(s * 3 % 360).toFixed(2)})`);
  $('raysB').setAttribute('transform', `rotate(${(-s * 2 % 360).toFixed(2)})`);
  $('rays').setAttribute('opacity', ((0.05 + 0.22 * strength) * flick * pulse).toFixed(3));
  rayNodes.forEach((n, i) => n.setAttribute('opacity', (0.35 + 0.65 * Math.sin(s * (0.4 + (i % 5) * 0.13) + i * 1.7) ** 2).toFixed(2)));
  $('dust').setAttribute('fill', pal('core'));
  for (const p of dust) {
    p.a += p.w * dt;
    const d = p.d + Math.sin(s * 0.3 + p.ph) * 18;
    p.n.setAttribute('cx', (gx + Math.cos(p.a) * d + Math.sin(s * 0.7 + p.ph) * 6).toFixed(1));
    p.n.setAttribute('cy', (gy + Math.sin(p.a) * d * 0.9 + Math.cos(s * 0.5 + p.ph) * 6).toFixed(1));
    p.n.setAttribute('opacity', ((0.15 + 0.75 * strength) * Math.max(0, 1 - d / 280) * (0.5 + 0.5 * Math.sin(s * 1.3 + p.ph))).toFixed(3));
  }
  for (const p of farDust) {
    p.a += p.w * dt;
    const d = p.d + Math.sin(s * 0.25 + p.ph) * 22;
    p.n.setAttribute('cx', (CX + Math.cos(p.a) * d * VIEW.kx + Math.sin(s * 0.6 + p.ph) * 10).toFixed(1));
    p.n.setAttribute('cy', (CY + Math.sin(p.a) * d * 0.9 * VIEW.ky + Math.cos(s * 0.45 + p.ph) * 10).toFixed(1));
    p.n.setAttribute('opacity', ((0.2 + 0.25 * strength) * (0.35 + 0.65 * Math.sin(s * 0.9 + p.ph) ** 2)).toFixed(3));
  }

  // moths
  for (const [k, m] of moths) {
    let tx, ty, ease = 1.5, flap = 22.4; // radians per second: about 3.6 wingbeats a second
    const parent = m.parentId && moths.get(m.parentId);
    if (m.parentId && (!parent || parent.leaving)) m.leaving = true;
    const needsMe = !m.leaving && !m.parentId && m.session?.state === 'waiting';
    if (m.leaving) {
      const ang = Math.atan2(m.y - CY, m.x - CX);
      tx = CX + Math.cos(ang) * 600; ty = CY + Math.sin(ang) * 600; ease = 0.8;
      if (Math.hypot(m.x - CX, m.y - CY) > 420) { m.g.remove(); m.thread?.remove(); moths.delete(k); if (hovered === m) { hovered = null; $('card').classList.remove('show'); } continue; }
    } else if (parent) {
      // subagents circle their own session's moth
      m.a += m.speed * dt;
      const r = m.r + Math.sin(s * 2.1 + m.phase) * 6;
      tx = parent.x + Math.cos(m.a) * r; ty = parent.y + Math.sin(m.a) * r * 0.75;
      ease = 5; flap = 29;
    } else if (needsMe) {
      // land with the wing joint on the paper (the joint sits 2,6 from the moth's position)
      if (!m.wasLanded) {
        // a new spot every landing, on whichever side of the lantern has fewer moths right now
        let lean = 0;
        for (const o of moths.values()) if (o !== m && o.wasLanded) lean += o.perch[0] < 340 ? -1 : 1;
        // try a few spots and keep the first with room around it, or failing that the roomiest one
        const side = lean < 0 ? 1 : lean > 0 ? -1 : undefined, others = [...moths.values()].filter(o => o !== m && o.wasLanded);
        const room = p => Math.min(Infinity, ...others.map(o => Math.hypot(o.perch[0] - p[0], o.perch[1] - p[1])));
        let best = pickPerch(side);
        for (let i = 0; i < 20 && room(best) < 40; i++) { const c = pickPerch(side); if (room(c) > room(best)) best = c; }
        m.perch = best;
      }
      [tx, ty] = rot(m.perch[0], m.perch[1]); tx += 2 * m.size; ty += 6 * m.size; ease = 2.5;
    } else {
      // stay near home, drifting lazily
      const [hx, hy] = stretch(m.home);
      tx = hx + Math.sin(s * 0.5 + m.phase) * 24 + Math.sin(s * 1.3 + m.phase * 2) * 8;
      ty = hy + Math.cos(s * 0.4 + m.phase) * 18 + Math.sin(s * 1.7 + m.phase) * 6;
    }
    const nx = m.x + (tx - m.x) * Math.min(1, dt * ease), ny = m.y + (ty - m.y) * Math.min(1, dt * ease);
    // lean gently into the direction of travel, eased so position jitter doesn't shake it
    // each landing settles at its own angle around the outward direction, so moths on the lantern don't all match
    if (needsMe && !m.wasLanded) m.landJitter = (Math.random() * 2 - 1) * 15;
    m.wasLanded = needsMe;
    const lean = needsMe ? 0 : Math.max(-15, Math.min(15, (nx - m.x) / (dt || 1) * 0.25));
    m.tilt = (m.tilt || 0) + (lean - (m.tilt || 0)) * Math.min(1, dt * 3);
    m.x = nx; m.y = ny;

    // Wingbeat in depth: both tips rise toward the viewer and dip slightly away. How high each beat goes drifts,
    // and the two wings are a touch out of step, so no two beats look exactly alike.
    // keep flapping all the way in; only a moth that has reached its spot slows down and folds
    const perched = needsMe && Math.hypot(tx - m.x, ty - m.y) < ((m.fold || 0) > 0.5 ? 10 : 4); // slack once folded, so the sway can't make it flicker
    m.beat = (m.beat ?? m.phase) + (perched ? 1.5 : flap) * dt; // accumulated, so speed changes never jump the wings
    const beat = m.beat;
    const height = (perched ? 0.35 : 1) * (0.85 + 0.15 * Math.sin(s * 0.9 + m.phase * 2)); // every beat stays clearly visible
    const liftAt = lag => height * 80 * Math.PI / 180 * (0.7 * Math.sin(beat - lag) + 0.3);
    const sweep = perched ? 0 : 0.4 * Math.cos(beat);
    // landing folds the flapping wings into the side view; taking off unfolds them again
    m.fold = (m.fold || 0) + ((perched ? 1 : 0) - (m.fold || 0)) * Math.min(1, dt * 2.5);
    const out = (m.perch?.[2] ?? 0) + sway + (m.landJitter || 0), part = 5 + 4 * Math.sin(s * 1.2 + m.phase);
    // Each moth slowly turns in 3D around its body axis, drifting between seen-from-above and side-on (either way).
    // Mostly near top-down, sometimes swinging well round; landed moths settle back flat before folding.
    const drift = 0.6 * Math.sin(s * 0.21 + m.phase) + 0.4 * Math.sin(s * 0.53 + m.phase * 1.7);
    const rollTo = needsMe ? 0 : Math.sign(drift) * Math.abs(drift) ** 1.3 * 80 * Math.PI / 180;
    m.roll = (m.roll || 0) + (rollTo - (m.roll || 0)) * Math.min(1, dt * 2);
    const near = flapWing(WING_UP, liftAt(0), sweep, m.roll);
    const far = flapWing(WING_SIDE, liftAt(0.18), sweep, m.roll);
    m.up.setAttribute('d', pathOf(mixPts(near, foldedWing(out, 1, m.perch?.[3]), m.fold)));
    m.side.setAttribute('d', pathOf(mixPts(far, foldedWing(out + part, 0.95, m.perch?.[3]), m.fold)));
    m.g.setAttribute('transform', `translate(${m.x.toFixed(1)} ${m.y.toFixed(1)}) rotate(${m.tilt.toFixed(1)}) scale(${m.size})`);

    // color: moths near the lantern catch its light; the session that needs me turns violet with a pale outline
    m.cool += ((needsMe ? (m.session.snoozed ? 0.5 : 1) : 0) - m.cool) * dt * 3; // snoozed moths rest on the lantern in a paler indigo
    const lit = Math.max(level, cool * 0.5) * Math.max(0, 1 - Math.hypot(m.x - CX, m.y - CY) / 330);
    const wing = mix(mix(MOTH_IDLE, pal('glow'), lit * 0.45), MOTH_CALL, m.cool);
    const st = m.g.style;
    st.setProperty('--wing', wing);
    st.setProperty('--edge', `rgba(246,240,255,${(m.cool * 0.9).toFixed(2)})`);

    // one thread from the light to each session moth, bowing gently
    if (m.thread) {
      const [ax, ay] = rot(...style.light);
      const dx = m.x - ax, dy = m.y - ay, len = Math.hypot(dx, dy) || 1;
      const bow = Math.sin(s * 0.8 + m.phase) * 0.12 * len + 0.08 * len;
      const qx = ax + dx / 2 - dy / len * bow, qy = ay + dy / 2 + dx / len * bow;
      m.thread.setAttribute('d', `M${ax.toFixed(1)} ${ay.toFixed(1)} Q${qx.toFixed(1)} ${qy.toFixed(1)} ${m.x.toFixed(1)} ${m.y.toFixed(1)}`);
      m.thread.setAttribute('stroke', mix(pal('thread'), COOL.thread, m.cool));
      m.thread.setAttribute('opacity', m.leaving ? 0.3 : 0.8);
    }
  }
  placeCard();
}
// The macOS screensaver's web view never fires requestAnimationFrame, so when it goes quiet a timer takes over,
// and the screensaver also calls lanternTick() on its own animation clock. In a normal window rAF runs and these idle.
let rafAt = 0;
const loop = t => { rafAt = performance.now(); frame(t); requestAnimationFrame(loop); };
requestAnimationFrame(loop);
window.lanternTick = () => { const now = performance.now(); if (now - rafAt > 100) { rafAt = now - 67; frame(now); } };
setInterval(lanternTick, 33);

// ---- hover card ------------------------------------------------------------------
const ago = ms => ms < 60e3 ? `${Math.max(0, Math.round(ms / 1e3))}s` : ms < 3600e3 ? `${Math.round(ms / 60e3)} min` : `${Math.floor(ms / 3600e3)}h ${Math.round(ms % 3600e3 / 60e3)}m`;
const project = s => s.cwd.split('/').filter(Boolean).pop() || '(unknown)';
function line(text, cls) { const d = document.createElement('div'); d.textContent = text; if (cls) d.className = cls; return d; }

function renderCard() {
  const m = hovered, s = m?.session;
  if (!s) return;
  const now = Date.now(), h = document.createElement('h3'), chip = document.createElement('span');
  const rows = [h], name = s.title || project(s);
  if (m.parentId) {
    const a = s.subagents.find(x => m.key.endsWith('/' + x.id)) || {};
    h.textContent = a.description || a.type || 'subagent';
    chip.textContent = a.type || 'subagent';
    if (a.activity) rows.push(line(`Now: ${a.activity}`));
    rows.push(line(`For ${name}`, 'dim'), line(`Last activity ${ago(now - (a.last || s.last))} ago`, 'dim'));
  } else {
    h.textContent = name;
    chip.textContent = s.snoozed && s.state === 'waiting' ? 'snoozed' : { working: 'working', waiting: 'needs you', paused: 'waiting on agents', idle: 'idle' }[s.state] || s.state;
    chip.className = 'chip ' + (s.snoozed && s.state === 'waiting' ? 'idle' : s.state);
    if ((s.state === 'waiting' || s.state === 'paused') && s.note) rows.push(line(s.note, s.state === 'waiting' ? 'note' : ''));
    if (s.tasks?.length) rows.push(line(`Running: ${s.tasks.join(', ')}`, 'dim'));
    else if (s.activity) rows.push(line(`Now: ${s.activity}`));
    if (s.prompt) rows.push(line(`“${s.prompt.length > 140 ? s.prompt.slice(0, 140) + '…' : s.prompt}”`, 'prompt'));
    for (const a of s.subagents) rows.push(line(`↳ ${a.description || a.type || 'subagent'}${a.activity ? ': ' + a.activity : ''}`, 'dim'));
    if (s.iterm) rows.push(line('Click to open in iTerm', 'dim'));
    if (s.state === 'waiting') rows.push(line(s.snoozed ? 'Snoozed until it does something new · right-click to wake' : 'Right-click to snooze', 'dim'));
    rows.push(line(`${project(s)} · running ${ago(now - s.started)} · active ${ago(now - s.last)} ago`, 'dim'));
  }
  chip.className ||= 'chip';
  h.append(chip);
  $('card').replaceChildren(...rows);
  $('card').classList.add('show');
}
setInterval(() => hovered && renderCard(), 500);

function placeCard() {
  if (!hovered) return;
  const pt = document.querySelector('svg').createSVGPoint();
  pt.x = hovered.x; pt.y = hovered.y;
  const p = pt.matrixTransform(document.querySelector('svg').getScreenCTM()), c = $('card');
  const x = Math.min(p.x + 22, innerWidth - c.offsetWidth - 12), y = p.y + 22 + c.offsetHeight > innerHeight - 8 ? p.y - c.offsetHeight - 18 : p.y + 22;
  c.style.transform = `translate(${Math.max(8, x)}px, ${Math.max(8, y)}px)`;
}

// ---- optional notification + chime --------------------------------------------
const box = $('notify');
let audio;
try { box.checked = localStorage.getItem('lantern-notify') === '1'; } catch {}
box.onchange = () => {
  try { localStorage.setItem('lantern-notify', box.checked ? '1' : '0'); } catch {}
  if (box.checked) { audio ??= new AudioContext(); if (Notification.permission === 'default') Notification.requestPermission(); }
};
function alertMe(s) {
  if (!box.checked) return;
  const name = s.title || s.cwd.split('/').filter(Boolean).pop() || 'a session';
  if (Notification.permission === 'granted') new Notification('Lantern', { body: `${name} needs you`, silent: true });
  audio ??= new AudioContext();
  const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
  o.frequency.setValueAtTime(660, t); o.frequency.exponentialRampToValueAtTime(990, t + 0.25);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 1);
}
</script>
