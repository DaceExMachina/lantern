<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  /* spacing scale on a 4px base; the stats panel and recap use it, the rest of the app moves over in a design-system pass */
  /* The design tokens: UI chrome (footer, menus, cards, stats, recap, tips, dev panel, the flash pill) takes every colour,
     space, radius, type size, shadow and layer from here. Add a token rather than a one-off value; scene art keeps its
     palettes in src/scene/*.ts. test/tokens.spec.js enforces this, and that the state and PR colours match the scene's.
     "Design tokens" in CONTRIBUTING.md lists them. */
  :root {
    /* night and surfaces */
    --night: #1E1930; --surface: rgb(30 24 46 / .96); --surface-card: rgb(30 24 46 / .92);
    --surface-raised: #2B2440; --surface-selected: #4A3B68; --line: #4A3B68; --line-soft: #3A2E52;
    /* ink, brightest to faintest */
    --ink-strong: #F5E9FF; --ink-hover: #F0E8FF; --ink: #D8CCE6; --ink-soft: #C9B8DA; --ink-dim: #8F7FA6; --ink-faint: #6B5C88;
    /* accents */
    --accent-violet: #C3B2FF; --accent-violet-line: #5B4A8A; --focus: #B9A8FF; --accent: var(--state-waiting);
    --accent-warm: #FFC266; --accent-warm-ink: #FFE2BE; --accent-warm-surface: #5A3E2A; --warn-ink: #E8C8A8;
    /* session states and the lantern: the same colours as lanterns.ts and stats.ts */
    --state-working: #E9DCF0; --state-waiting: #7B5CFF; --state-snoozed: #B29CF8; --state-idle: #8B7FA2;
    --lantern-warm: #F7913F; --lantern-violet: #7A63F0; --lantern-quiet: #3A3050;
    /* a hover card's pill and tray: the waiting and error pills, the tray under the card, and the running agents' cool band
       (also the waiting-on-agents pill) */
    --state-waiting-chip: #5B44C9; --error-surface: #4A3A40; --error-ink: #E8C8C8; --surface-tray: rgb(20 16 32 / .55);
    --agents-surface: rgb(51 64 94 / .28); --agents-line: #33405E; --agents-ink: #C4D2F0; --agents-ink-dim: #9DB0D6;
    /* what a PR needs: the same colours as FLY (fireflies.ts) */
    --pr-ready: #C8F48A; --pr-failing: #FF9E8C; --pr-changes: #FFAA6E; --pr-feedback: #FFD27A; --pr-draft: #FFF2B8; --pr-in-review: #8CCBFF;
    --pr-review: #E8F48A; --pr-mention: #E8F48A;
    /* spacing: one scale, 1 = 4px */
    --space-0-5: 2px; --space-1: 4px; --space-1-5: 6px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
    /* radius */
    --radius-sm: 3px; --radius-md: 6px; --radius-lg: 10px; --radius-pill: 99px;
    /* type: Georgia has only a regular and a bold face, so 400 and 700 are the only weights */
    --font-serif: Georgia, 'Times New Roman', serif; --font-mono: ui-monospace, monospace;
    --text-xs: 11px; --text-sm: 12.5px; --text-md: 14px; --text-lg: 16px; --text-xl: 20px; --text-display: 40px;
    --weight-regular: 400; --weight-bold: 700; --leading: 1.45; --tracking-label: .04em;
    /* elevation, glass, layers, motion */
    --shadow-lg: 0 8px 28px rgb(0 0 0 / .45); --rim: inset 0 0 0 1px rgb(255 255 255 / .22); --blur-glass: blur(6px);
    --z-tip: 1; --z-flash: 5; --z-overlay: 10; --fade: .15s; --slide: .45s cubic-bezier(.4, 0, .2, 1); --faded: .4;
    /* layout */
    --dock-width: 380px; --titlebar: 0px; /* the height of the app window's drag strip along the top (app/main.swift DragStrip), which takes every click on it (it stops short of the pinned sidebar): 28px under body.app, nothing in a browser tab, the iTerm panel or a screensaver */
  }
  body.app { --titlebar: 28px; } /* wiring.ts sets it from ?app, which Lantern.app adds to its URL */
  /* thin scrollbars tinted to the app on every scroller. The standard properties are all WebKit needs now; the ::-webkit-scrollbar
     pseudo-elements are ignored once scrollbar-color is set, and without it they'd turn macOS's overlay bars into space-taking ones */
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  *:hover { scrollbar-color: var(--ink-faint) transparent; }
  html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink-soft); font: var(--text-md)/1.4 var(--font-serif); }
  body { display: grid; grid-template-rows: minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr) auto; } /* the scene, the pinned sidebar beside it, the footer under both */
  footer { grid-column: 1 / -1; }
  /* The scene is a picture: no selecting the zz or the session text. The lantern's layers, turned as it swings, reach past
     its corners; clipped, they can't scroll the page. On the screensaver (no footer under the scene) they did, near each
     end of the swing, and the scrollbar narrowed the scene, so fitView refitted it and the whole screen jumped. */
  #scene { position: relative; min-height: 0; overflow: clip; -webkit-user-select: none; user-select: none; }
  #scene > * { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #scene > [hidden] { display: none; } /* the rule above would otherwise beat the hidden attribute (pages.ts hides the ink canvas on lanterns with no paper) */
  /* the status sits centred on the window while it fits; as the window narrows the empty left track gives way first,
     so the text slides left, and once all the room left of the buttons (--corners wide) is used it shrinks (StatusLine.vue) */
  footer { --corners: 110px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(var(--corners), 1fr); align-items: center; padding: var(--space-3) 0; position: relative; }
  #statusSlot { display: contents; } /* StatusLine.vue mounts here; its #status is the footer's grid item */
  #status { grid-column: 2; min-width: 0; white-space: nowrap; text-align: center; padding: 0 var(--space-3); } /* the padding keeps the text off the window edge once it has slid all the way left */
  /* the settings button in the corner, and the menu that flies up from it */
  /* the quiet, stats and settings buttons: each one's click area runs the bar's full height and meets its neighbours',
     so there's no dead spot between or around them */
  .corners { position: absolute; top: 0; right: 0; bottom: 0; display: flex; }
  .corner { all: unset; cursor: pointer; color: var(--accent-violet); display: flex; align-items: center; padding: 0 var(--space-1-5); }
  .corner:last-child { padding-right: var(--space-4); }
  .corner:hover { color: var(--ink-hover); }
  #quiet.on svg path:first-child { fill: currentColor; } /* a full moon... well, a filled one, while quiet is on */
  .corner:focus-visible { outline: 1px solid var(--focus); outline-offset: -3px; }
  .flyup { inset: auto var(--space-3) 52px auto; margin: 0; width: 260px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: var(--space-3) 14px; color: var(--ink); font-size: var(--text-sm); line-height: 1.5; box-shadow: var(--shadow-lg); }
  .flyup:popover-open { display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 72px); overflow-y: auto; }
  #help { border-top: 1px solid var(--line-soft); padding-top: 10px; }
  #help summary { cursor: pointer; color: var(--accent-violet); }
  #help summary:hover { color: var(--ink-hover); }
  #help p { margin: var(--space-1-5) 0 0; }
  #help b { color: var(--ink-hover); font-weight: var(--weight-bold); }
  #help .key { white-space: nowrap; }
  #help .swatch { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin: 0 var(--space-0-5) 0 var(--space-1-5); }
  /* the settings: each row's click area runs its full width and meets the next row's, so there's no dead spot between them */
  #menu { padding-top: 7px; }
  #menu:popover-open { gap: 0; }
  /* each option's tip is a docked card like the recap's, above the menu at its width (src/components/SettingsMenu.vue docks it). It shows after a
     short hover on the row, or when a control in it has keyboard focus. */
  #menu .tip { max-width: none; box-sizing: border-box; z-index: var(--z-tip); transition-delay: .5s; }
  #menu .tip.show { opacity: 1; }
  #menu > label { display: flex; padding: 5px 0; }
  #menu .time { justify-content: space-between; white-space: nowrap; }
  /* quiet from and quiet until: their words, an off | on switch built like the time input, then the time (faded while off).
     The times line up with the day rollover's below.
     Nothing moves when it flips. The words and each half of the switch run the row's full height, and the halves touch. */
  #menu .switch { display: flex; }
  #menu .switch > span:first-child { flex: 1; display: flex; align-items: center; padding: 5px 0; }
  #menu .switch > label { display: flex; padding-left: var(--space-2); } /* the time's click area runs the row's full height too */
  #menu .switch input:disabled { opacity: var(--faded); }
  #menu input[type=time], .pill button span { box-sizing: border-box; height: 26px; } /* the switch matches the input */
  #menu input[type=time] { width: 8.6em; } /* one width for every time, the widest value's, so their edges line up */
  .pill { display: flex; }
  .pill button { all: unset; cursor: pointer; display: flex; align-items: center; padding: 5px 0; }
  .pill button span { display: flex; align-items: center; padding: 0 var(--space-2); border: 1px solid var(--line); background: var(--surface-raised); color: var(--accent-violet); }
  .pill button:first-child span { border-radius: var(--radius-md) 0 0 var(--radius-md); }
  .pill button:last-child span { border-radius: 0 var(--radius-md) var(--radius-md) 0; border-left: none; }
  .pill button[aria-pressed=true] span { background: var(--surface-selected); color: var(--ink-strong); }
  .pill button:hover span { color: var(--ink-hover); }
  .pill button:focus-visible span { outline: 1px solid var(--focus); outline-offset: 1px; }
  #menu #style { flex: 1; }
  #menu > :has(+ .tip + #gh) { padding-bottom: 10px; } /* the last row reaches down to the GitHub section's line */
  #menu #help { margin-top: 5px; }
  #menu .ribbon { display: flex; align-items: center; gap: var(--space-1-5); }
  #menu .unavailable { opacity: var(--faded); }
  #ribbons { flex: 1; display: flex; } /* the swatches touch, and each one's click area runs the row's height */
  #ribbons button { all: unset; flex: 1; display: flex; justify-content: center; padding: 5px 0; cursor: pointer; }
  #ribbons button::before { content: ''; width: 16px; height: 16px; border-radius: 50%; background: var(--c); box-shadow: var(--rim); } /* a pale rim so the dark ones read */
  #ribbons button[aria-pressed=true]::before { box-shadow: var(--rim), 0 0 0 1.5px var(--night), 0 0 0 2.6px var(--ink-hover); }
  #ribbons button:focus-visible::before { outline: 1px solid var(--focus); outline-offset: 4px; }
  #ribbons button:disabled { cursor: default; }
  /* the stats panel: the settings menu's look, over the scene; anchored at the top so a badge's card opening below it
     doesn't shift the badges */
  #stats, #recap { inset: max(var(--space-5), var(--titlebar)) 0 auto; margin: 0 auto; box-sizing: border-box; width: min(560px, calc(100vw - 24px)); height: fit-content; max-height: calc(100vh - 24px - max(var(--space-5), var(--titlebar))); padding: var(--space-4); }
  #stats:popover-open { gap: var(--space-4); }
  #recap:popover-open { gap: var(--space-3); }
  #stats h3 { margin: 0; font-size: 13px; font-weight: var(--weight-regular); color: var(--ink-dim); letter-spacing: var(--tracking-label); text-transform: uppercase; }
  #stats h4 { margin: var(--space-4) 0 0; font-size: var(--text-xs); font-weight: var(--weight-regular); color: var(--ink-dim); letter-spacing: var(--tracking-label); text-transform: uppercase; }
  #statsBody { display: flex; flex-direction: column; gap: var(--space-4); container-type: inline-size; }
  #statsWeek { display: flex; flex-direction: column; gap: var(--space-2); } /* a heading, then its content; each heading after the first starts a new section */
  #statsWeek h4:first-child { margin-top: 0; }
  :is(#stats, #recap) .headline { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
  :is(#stats, #recap) .headline b { display: block; white-space: nowrap; font-size: clamp(28px, 10vw, var(--text-display)); line-height: 1; font-weight: var(--weight-bold); color: var(--accent-warm); font-variant-numeric: tabular-nums; }
  :is(#stats, #recap) .headline span { display: block; margin-top: var(--space-1); color: var(--ink-soft); }
  :is(#stats, #recap) .ribbon svg { display: block; width: 100%; height: 50px; }
  #stats .ribbon svg { height: 68px; }
  :is(#stats, #recap) .ribbon { position: relative; touch-action: pan-y; }
  :is(#stats, #recap) .cursor { position: absolute; top: 0; bottom: 0; width: 1px; margin-left: -.5px; background: var(--ink-strong); pointer-events: none; }
  :is(#stats, #recap) [data-v] { display: inline-block; font-weight: var(--weight-regular); color: var(--ink); font-variant-numeric: tabular-nums; }
  :is(#stats, #recap) .axis [data-v] { min-width: 6em; text-align: center; }
  :is(#stats, #recap) :is(.axis, .legend) { display: flex; justify-content: space-between; color: var(--ink-dim); font-size: var(--text-xs); margin-top: calc(-1 * var(--space-1)); }
  /* The legend's four moth states in a plain grid, 2 by 2 when there's room, else 1 across. A column is 16em: the swatch,
     "snoozed / sleeping" (the longest label) and a 5.4em slot that fits "188h 58m", the longest value, so nothing wraps.
     Four across would need about 700px, more than the panel has. */
  :is(#stats, #recap) .dayRibbon { display: flex; flex-direction: column; gap: var(--space-2); }
  :is(#stats, #recap) .legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(16em, 1fr)); gap: var(--space-1) var(--space-3); margin-top: 0; }
  :is(#stats, #recap) .legend span { display: flex; align-items: center; white-space: nowrap; }
  :is(#stats, #recap) .legend [data-v] { margin-left: auto; min-width: 5.4em; text-align: right; }
  :is(#stats, #recap) .legend i { display: inline-block; width: 12px; height: 7px; border-radius: 2px; margin: 0 var(--space-1) 0 var(--space-0-5); }
  :is(#stats, #recap) dl { display: grid; gap: var(--space-2) var(--space-3); margin: 0; }
  /* the stats panel's six numbers: 3 by 2 when there's room (380px), else 2 by 3 */
  #stats dl { grid-template-columns: repeat(2, 1fr); }
  @container (min-width: 380px) { #stats dl { grid-template-columns: repeat(3, 1fr); } }
  :is(#stats, #recap) dt { color: var(--ink-dim); font-size: var(--text-xs); }
  :is(#stats, #recap) dd { margin: 0; color: var(--ink-strong); font-size: var(--text-lg); font-variant-numeric: tabular-nums; }
  #stats .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--space-1); }
  #stats .day svg, #stats .day .none { display: block; width: 100%; height: 26px; }
  #stats .day .none { border: 1px dashed var(--line-soft); border-radius: var(--radius-sm); box-sizing: border-box; }
  #stats .day b { color: var(--ink); font-weight: var(--weight-regular); }
  :is(#stats, #recap) .dim { color: var(--ink-dim); margin: 0; }
  :is(#stats, #recap) .badges { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  #stats .badge, #recap .badge { all: unset; cursor: pointer; font-size: 11.5px; padding: 1px var(--space-2); border-radius: var(--radius-pill); background: var(--accent-warm-surface); color: var(--accent-warm-ink); white-space: nowrap; }
  #stats .badge:focus-visible, #recap .badge:focus-visible { outline: 1px solid var(--focus); outline-offset: 2px; }
  /* a badge's tip, and an overflow PR's on a moth's card: at most the window less 16px, padding and border included. Its
     width is its own (max-content), not what's left beside it, so the width tipSpot measures is the one it keeps. */
  .badgeTip { --pad-x: 10px; position: fixed; z-index: var(--z-overlay); pointer-events: none; width: max-content; max-width: min(240px, calc(100vw - 2 * var(--space-2) - 2 * var(--pad-x) - 2px)); padding: var(--space-2) var(--pad-x); border: 1px solid var(--line);
    border-radius: var(--radius-lg); background: rgba(30, 24, 46, .97); box-shadow: 0 8px 24px rgba(0,0,0,.45); font-size: 12px; line-height: var(--leading);
    opacity: 0; transition: opacity .12s; }
  .badgeTip.show { opacity: 1; }
  .badgeTip b { color: var(--ink-strong); font-weight: var(--weight-bold); }
  .badgeTip .dim { color: var(--ink-dim); }
  #stats .badge.unearned { background: none; color: var(--ink-faint); box-shadow: inset 0 0 0 1px var(--line-soft); }
  #stats .badge small { opacity: .7; font-size: 10px; }
  #stats .shelf { margin-top: var(--space-2); }
  #stats .shelf summary { cursor: pointer; color: var(--accent-violet); font-size: 12px; margin-bottom: var(--space-2); }
  #stats .shelf summary:hover { color: var(--ink-hover); }
  #stats .day { all: unset; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: var(--text-xs); color: var(--ink-dim); min-width: 0; }
  #stats button.day { cursor: pointer; border-radius: 4px; }
  #stats button.day:hover span, #stats button.day:hover b { color: var(--ink-hover); }
  #stats button.day:focus-visible { outline: 1px solid var(--focus); outline-offset: 2px; }
  #stats h3 .link { all: unset; cursor: pointer; float: right; text-transform: none; letter-spacing: 0; color: var(--accent-violet); font-size: 12px; }
  #stats h3 .link:hover { color: var(--ink-hover); }
  /* the daily recap: the stats panel's look */
  #recap h3 { margin: 0; font-size: 15px; font-weight: var(--weight-regular); color: var(--ink-strong); display: flex; justify-content: space-between; }
  #recap .close { all: unset; cursor: pointer; color: var(--ink-dim); font-size: 18px; line-height: 1; }
  #recap .close:hover { color: var(--ink-hover); }
  #recap dl { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
  #recap dd { font-size: 15px; }
  #recap .starsBox { position: relative; }
  #recap .star.lit circle:first-child { opacity: .35; }
  #recap .stars { display: block; width: 100%; height: auto; overflow: visible; } /* dots at the day's edges show whole */
  #recap .star { cursor: default; outline: none; }
  #recap .star:focus-visible circle:last-child { stroke: var(--ink-strong); stroke-width: 1; }
  #recap .starCard { z-index: var(--z-overlay); box-sizing: border-box; max-width: none; display: grid; grid-template-columns: 1fr 1fr; gap: 0 var(--space-4); align-content: start; }
  #recap .starCard h3 { grid-column: 1 / -1; display: block; height: 20px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #recap .starCard > div { min-width: 0; }
  #recap .starCard > div + div { margin-top: 0; }
  #recap .star.picked circle:last-child { stroke: var(--ink-strong); stroke-width: 1.2; }
  #recap .starCard h3 .link { all: unset; cursor: pointer; border-bottom: 1px solid var(--accent-violet-line); }
  #recap .starCard h3 .link:hover { color: var(--ink-hover); border-color: var(--focus); }
  #recap .starCard.show { opacity: 1; pointer-events: auto; } /* beats the shared card rule, whose #card lends it an id's weight */
  #gh { border-top: 1px solid #3A2E52; padding-top: 10px; }
  #status.waiting { color: #B9A8FF; }
  #status .warm { color: var(--ink-dim); }
  #status.offline { color: #8A7A99; font-style: italic; }
  #gh h3 { margin: 0 0 var(--space-1); font-size: 13px; color: var(--ink-strong); display: flex; align-items: center; gap: var(--space-1-5); }
  #gh h3 svg { color: var(--accent-violet); }
  #gh .row { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); margin: 3px 0; }
  #gh .row:has(.tools) { margin: 0; }
  #gh .code { font: 600 var(--text-xl)/1.2 var(--font-mono); letter-spacing: .12em; color: var(--ink-strong); margin: var(--space-1-5) 0; }
  #gh button { all: unset; cursor: pointer; color: var(--accent-violet); text-decoration: underline dotted; text-underline-offset: 3px; }
  #gh button:hover, #gh a:hover, #help a:hover { color: var(--ink-hover); }
  #gh a, #help a { color: var(--accent-violet); }
  /* the link's row ends in two icon buttons: their click areas run the row's full height and meet, the hover is just the icon,
     and the pair reaches out into the menu's padding so the icons line up with the text edge */
  #gh .tools { display: flex; align-self: stretch; margin-right: calc(-1 * var(--space-1-5)); }
  #gh .icon { display: flex; align-items: center; padding: var(--space-1) var(--space-1-5); text-decoration: none; }
  #gh .icon .face { display: flex; border-radius: var(--radius-sm); } /* the visible part: just the icon, so the focus ring hugs it */
  #gh .icon:focus-visible .face { outline: 1px solid var(--focus); outline-offset: var(--space-0-5); }
  #gh .dim { color: var(--ink-dim); font-size: 11.5px; }
  #gh .warn { color: var(--warn-ink); }
  #status .next { all: unset; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px;
    padding: var(--space-3) 0; margin: calc(-1 * var(--space-3)) 0; } /* clickable to the bar's top and bottom edges, without moving the text */
  #status .next:hover { color: #E4DAFF; }
  .panel #status .next { padding: var(--space-1-5) 0; margin: calc(-1 * var(--space-1-5)) 0; }
  #status .next:focus-visible { outline: 1px solid var(--focus); outline-offset: 2px; }
  /* What's playing (src/components/NowPlaying.vue): a glass strip over the scene's bottom left corner, just above the footer.
     The buttons share the strip's padding: each runs its full height and meets the next, and the last reaches its right edge. */
  #nowPlayingSlot { display: contents; }
  #nowPlaying { position: absolute; left: var(--space-3); bottom: calc(100% + var(--space-2)); display: flex; align-items: stretch;
    max-width: min(320px, calc(100% - 2 * var(--space-3))); box-sizing: border-box; padding-left: var(--space-2);
    background: var(--surface-card); -webkit-backdrop-filter: var(--blur-glass); backdrop-filter: var(--blur-glass);
    border: 1px solid var(--line); border-radius: var(--radius-lg); color: var(--ink); font-size: var(--text-sm); line-height: var(--leading); }
  #nowPlaying .art { align-self: center; width: 36px; height: 36px; margin-right: var(--space-2); border-radius: var(--radius-md); object-fit: cover; }
  #nowPlaying .what { flex: 1; min-width: 0; padding: var(--space-2) var(--space-1) var(--space-2) 0; }
  #nowPlaying .title { color: var(--ink-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #nowPlaying .by { color: var(--ink-dim); font-size: var(--text-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #nowPlaying .opens { cursor: pointer; }
  #nowPlaying button { all: unset; cursor: pointer; display: flex; align-items: center; padding: 0 var(--space-1-5); color: var(--accent-violet); }
  #nowPlaying button:last-child { padding-right: var(--space-3); }
  #nowPlaying button:hover { color: var(--ink-hover); }
  #nowPlaying button:focus-visible { outline: 1px solid var(--focus); outline-offset: -3px; }
  /* compact layout for iTerm2's toolbelt panel (opened with ?panel) */
  .panel footer { --corners: 86px; font-size: var(--text-xs); padding: var(--space-1-5) 0; } /* room for the quiet, stats and menu buttons */
  .panel .corner { padding: 0 var(--space-1); }
  .panel .corner:last-child { padding-right: var(--space-1-5); }
  .panel .flyup { right: var(--space-1-5); bottom: 36px; width: min(260px, calc(100vw - 12px)); }
  .panel #card { max-width: 210px; font-size: var(--text-xs); }
  .panel .notify { display: none; }
  /* screensaver mode (opened with ?screensaver): just the scene, with the glow running to the screen's edges */
  body.screensaver { background: #2B2440; cursor: none; }
  .screensaver footer, .screensaver #card { display: none; }
  /* The lantern in a layer of its own, swung by a CSS transform (frame.ts swingLantern) about where it hangs from: WebKit
     turns the picture it has instead of drawing the lantern afresh every frame, redrawing only the parts that change
     (its flame and light), and the wisps, threads and moths moving round it no longer make it redraw the lantern under
     them. Only as wide as the lanterns (scene.ts fitView). It's two layers, turned together: a paper lantern's back paper
     (#lanternBack) and the rest (#lanternLayer), with the flame's canvas between them (background.ts drawFlame), so the
     flame burns behind the front paper and over the back. The flame's canvas is as wide but never turned: its shader
     draws the flame upright at its swung base. */
  .lanternLayer { right: auto; will-change: transform; }
  #flame, #pagesInk { right: auto; bottom: auto; }
  #pagesInk { will-change: transform; } /* swayed with the layers (placed over the paper by pages.ts lay) */
  /* ambient (a second display's screensaver): the lantern's light and the drifting dust */
  #lantern:not(.pencil) #cdPencil { display: none; } /* Jerrett's pencil on the candle (src/scene/pencil.ts) */
  .ambient #lantern, .ambient #lanternPaper, .ambient #pagesInk, .ambient #flame { display: none; } /* no moths, fireflies or wisps are made there; the lantern drawing is the one thing to skip */
  /* a badge just earned (src/scene/flash.ts): fireflies packed into a glowing pill near the top, with the name in dark ink */
  #flash { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: var(--z-flash); }
  #flash canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #flash .pill { all: unset; pointer-events: auto; cursor: pointer; position: absolute; top: max(22px, var(--titlebar)); left: 0; right: 0; margin: 0 auto; width: fit-content;
    display: flex; flex-direction: column; align-items: center; max-width: calc(100vw - 48px); box-sizing: border-box; padding: var(--space-3) 30px 13px;
    border-radius: var(--radius-pill); text-align: center; color: #2B2440; opacity: 0; font-family: var(--font-serif); } /* the book pages' face */
  #flash .pill b { font-size: 16.8px; font-weight: var(--weight-bold); }
  #flash .pill span { font-size: 14.4px; font-weight: var(--weight-bold); color: #3A2E52; }
  #flash .pill:focus-visible { outline: 1px solid var(--focus); outline-offset: 4px; }
  .panel #flash .pill { top: var(--space-3); padding: var(--space-2) 20px; max-width: calc(100vw - 24px); }
  .panel #flash .pill b { font-size: 14.4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  label { cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: var(--space-1-5); }
  label.unavailable { cursor: default; }
  label.unavailable input { cursor: default; }
  input[type=checkbox] { appearance: none; margin: 0; width: 13px; height: 13px; border: 1px solid var(--ink-faint); border-radius: var(--radius-sm); background: var(--surface-raised); display: grid; place-content: center; cursor: pointer; }
  input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
  input[type=checkbox]:checked::after { content: ''; width: 6px; height: 3px; border: solid #F6F0FF; border-width: 0 0 1.6px 1.6px; transform: translateY(-1px) rotate(-45deg); }
  input[type=checkbox]:focus-visible { outline: 1px solid var(--focus); outline-offset: 2px; }
  #threads path { animation: shimmer 2.4s linear infinite; }
  @keyframes shimmer { to { stroke-dashoffset: -18; } }
  .moth { pointer-events: none; }
  :is(#card, .starCard, #dock) .agents { margin-top: var(--space-1-5); color: var(--ink-dim); font-size: var(--text-xs); }
  :is(#card, .starCard, #dock) .pr { display: flex; align-items: baseline; gap: 0 var(--space-1); white-space: nowrap; }
  :is(#card, .starCard, #dock) .pr i { flex: none; width: 6px; height: 6px; border-radius: 50%; align-self: center; }
  :is(#card, .starCard, #dock) .pr span { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--ink-soft); }
  :is(#card, .starCard, #dock) a { color: var(--accent-violet); text-decoration: none; border-bottom: 1px solid var(--accent-violet-line); }
  :is(#card, .starCard, #dock) a:hover { color: var(--ink-hover); border-color: var(--focus); }
  select, input[type=time] { font: inherit; color: inherit; color-scheme: dark; background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-0-5) var(--space-1-5); }
  :is(#card, .starCard, .tip) { position: fixed; left: 0; top: 0; pointer-events: none; opacity: 0; transition: opacity var(--fade); max-width: 300px;
    background: var(--surface-card); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-3); color: var(--ink);
    font-size: var(--text-sm); line-height: var(--leading); box-shadow: var(--shadow-lg); backdrop-filter: var(--blur-glass); }
  #card.show { opacity: 1; pointer-events: auto; }
  #card.show.compact { pointer-events: none; } /* a hover card is a tooltip: the pointer passes through to the scene */
  #card { width: 300px; box-sizing: border-box; } /* every kind of card (moth, ghost, wisp), compact or expanded, is as wide as its max-width */
  #card .gist { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; color: var(--ink-soft); }
  :is(#card, .starCard, #dock) h3 { margin: 0 0 var(--space-1); font-size: var(--text-md); color: var(--ink-strong); display: flex; gap: var(--space-2); align-items: flex-start; }
  /* Every control on the card is an outer button or link that fills its zone: the padding around it, out to the card's
     edges and up to its neighbours, so the hit areas touch with no dead space. Its .face inside is the visible part
     (the pill, the hover tint), the size it always was, lit while the pointer is anywhere in the zone. */
  :where(:is(#card, #dock) :is(button, a):is(.open, .chip, .agent, .more, .tog, .pr2, .pin), :is(#card, #dock) .chips a) { all: unset; box-sizing: border-box; cursor: pointer; } /* :where, so the rules below win */
  :is(#card, #dock) :is(button, a):focus-visible .face { outline: 1px solid var(--focus); outline-offset: 0; }
  :is(#card, #dock) .face { display: block; border-radius: var(--radius-md); }
  /* the header: its padding (the card's, above and beside it) belongs to its two buttons, the title and the pill (a stale PR's or a ghost's has a plain .title and pill, same layout) */
  :is(#card, #dock) h3:has(:is(.open, .title)) { margin: calc(-1 * var(--space-3)) calc(-1 * var(--space-3)) 0; gap: 0; align-items: stretch; }
  :is(#card, #dock) h3 :is(.open, .title) { flex: 1; min-width: 0; display: flex; align-items: flex-start; padding: calc(var(--space-3) - var(--space-0-5)) 0 var(--space-0-5) var(--space-2); }
  :is(#card, #dock) h3 :is(.open, .title) .face { flex: 1; min-width: 0; padding: var(--space-0-5) var(--space-1); }
  :is(#card, #dock) h3 .open:hover .face { background: color-mix(in srgb, var(--accent-violet) 10%, transparent); }
  :is(#card, #dock) h3 .chip { flex: none; display: flex; align-items: flex-start; padding: var(--space-3) var(--space-3) 0 var(--space-1); }
  :is(#card, #dock) .chip .face { white-space: nowrap; margin-top: var(--space-0-5); font-size: var(--text-xs); font-weight: var(--weight-regular); padding: var(--space-0-5) var(--space-2); border-radius: var(--radius-pill); background: var(--surface-selected); color: var(--accent-warm-ink); }
  :is(#card, #dock) .chip:hover .face { filter: brightness(1.25); }
  :is(#card, #dock) .chip.waiting .face { background: var(--state-waiting-chip); color: var(--ink-hover); }
  :is(#card, #dock) .chip.idle .face { background: var(--line-soft); color: var(--ink-soft); }
  :is(#card, #dock) .chip.error .face { background: var(--error-surface); color: var(--error-ink); }
  :is(#card, #dock) .chip.paused .face { background: var(--agents-line); color: var(--agents-ink); }
  :is(#card, .starCard, #dock) .prompt { font-style: italic; color: var(--ink-strong); overflow-wrap: anywhere; }
  :is(#card, .starCard, #dock) .dim { color: var(--ink-dim); overflow-wrap: anywhere; }
  :is(#card, .starCard, #dock) div + div { margin-top: var(--space-1); }
  /* a session's card: the top is what it wants from you, the tray below is its work */
  /* never taller than the window: the header stays and the body scrolls, without scrolling the scene behind. The body
     takes the card's side and bottom padding so the tray's bleed to the edges isn't clipped. */
  #card:has(> .cardBody) { display: flex; flex-direction: column; max-height: calc(100vh - 16px); box-sizing: border-box; }
  #card .cardBody { min-height: 0; overflow: auto; overscroll-behavior: contain; margin: 0 calc(-1 * var(--space-3)) calc(-1 * var(--space-3)); padding: 0 var(--space-3) var(--space-3); }
  :is(#card, #dock) h3 .go { display: inline-flex; vertical-align: -1px; margin-left: var(--space-1-5); color: var(--ink-dim); }
  :is(#card, #dock) h3 .open:hover .go { color: var(--ink-hover); }
  :is(#card, #dock) .state { color: var(--ink-dim); font-size: var(--text-xs); display: flex; gap: var(--space-1-5); align-items: baseline; overflow-wrap: anywhere; }
  :is(#card, #dock) .state::before { content: '›'; color: var(--focus); }
  :is(#card, #dock) .state.error::before { content: '!'; }
  :is(#card, #dock) .ask { margin-top: var(--space-1); padding: var(--space-1-5) var(--space-2); border-radius: var(--radius-md); background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--ink-hover); }
  :is(#card, #dock) .ask::before { content: '? '; color: var(--focus); font-weight: var(--weight-bold); }
  :is(#card, #dock) .msg { margin-top: var(--space-1); padding: var(--space-1) 0 var(--space-1) var(--space-2); border-left: 2px solid var(--accent-violet-line); color: var(--ink-strong); }
  :is(#card, #dock) .msg a { color: var(--ink-hover); border-color: var(--accent-violet-line); }
  :is(#card, #dock) .foot { margin-top: var(--space-2); color: var(--ink-faint); font-size: var(--text-xs); }
  #card .counts { font-size: var(--text-sm); }
  #card .hint { margin-top: var(--space-0-5); color: var(--ink-faint); font-size: var(--text-xs); }
  :is(#card, #dock) .tray { margin: var(--space-2) calc(-1 * var(--space-3)) calc(-1 * var(--space-3)); padding: var(--space-1-5) var(--space-3) var(--space-2); background: var(--surface-tray); border-top: 1px solid var(--line-soft); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
  :is(#card, #dock) .tray .foot { margin-top: var(--space-1-5); }
  :is(#card, #dock) .head { display: flex; justify-content: space-between; align-items: baseline; color: var(--ink-dim); font-size: var(--text-xs); }
  :is(#card, #dock) .head .r { text-transform: none; letter-spacing: 0; }
  :is(#card, #dock) .tray > :not(:first-child):is(.head, .phead) { margin-top: var(--space-3); }
  /* the agents' own band, tinted cool and edge to edge across the tray, as in the mockups' agent tray */
  :is(#card, #dock) .agentZone { margin: 0 calc(-1 * var(--space-3)); padding: var(--space-1-5) var(--space-3) var(--space-2); background: var(--agents-surface); border-bottom: 1px solid var(--agents-line); }
  :is(#card, #dock) .tray > .agentZone:first-child { margin-top: calc(-1 * var(--space-1-5)); }
  :is(#card, #dock) .agentZone .head { color: var(--agents-ink-dim); }
  /* agents, three lines each in monospace: the live dot, task tag, model and time; the job; the step. A click opens one in full. */
  /* an agent's zone is its whole row, out over the band's side padding; half the gap between rows is each row's */
  :is(#card, #dock) .agent { display: block; width: calc(100% + 2 * var(--space-3)); font-family: var(--font-mono); font-size: var(--text-xs); line-height: var(--leading); margin: 0 calc(-1 * var(--space-3)); padding: var(--space-0-5) var(--space-1-5); }
  :is(#card, #dock) .agent .face { padding: var(--space-1) var(--space-1-5); }
  :is(#card, #dock) button.agent:hover .face { background: color-mix(in srgb, var(--accent-violet) 8%, transparent); }
  :is(#card, #dock) .arow { display: flex; gap: var(--space-1-5); align-items: center; }
  :is(#card, #dock) .agent .arow .job { flex: 1; min-width: 0; margin-top: 0; } /* the job on the first line, when there's no tag or model */
  :is(#card, #dock) .arow .t { flex: none; margin-left: auto; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  :is(#card, #dock) .arow .model { color: var(--ink-dim); }
  :is(#card, #dock) .arow :is(.tag, .model) { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } /* a long tag or model gives way to the time */
  :is(#card, #dock) .live { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-warm-ink); box-shadow: 0 0 var(--space-1-5) var(--accent-warm); animation: live 1.6s ease-in-out infinite; } /* the glow and pulse have no blur or motion token yet, so they borrow the space scale and keep 1.6s */
  :is(#card, #dock) .live.quiet { background: var(--accent-violet-line); box-shadow: none; animation: none; }
  @keyframes live { 50% { opacity: .35; } }
  :is(#card, #dock) .tag { color: var(--focus); background: var(--surface-raised); border: 1px solid var(--line-soft); border-radius: var(--radius-sm); padding: 0 var(--space-1); }
  :is(#card, #dock) .agent :is(.job, .astep) { display: block; margin-top: var(--space-0-5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  :is(#card, #dock) .agent.open :is(.job, .astep) { white-space: normal; overflow-wrap: anywhere; }
  :is(#card, #dock) .agent .job { color: var(--ink-strong); }
  :is(#card, #dock) .agent .astep { color: var(--ink-soft); }
  /* PRs: a header summing them up, the toggle (sidebar), then chips or two-line rows */
  :is(#card, #dock) .phead { display: flex; gap: var(--space-1-5); align-items: center; color: var(--ink-dim); }
  :is(#card, #dock) .ph { flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  :is(#card, #dock) .ph .sum { font-size: var(--text-xs); }
  :is(#card, #dock) .ph b { font-weight: var(--weight-regular); }
  :is(#card, #dock) .ph b.prs { color: var(--ink); } /* the "PRs" word, bright with one repo or several */
  /* several repos: the "PRs" heading with the total beside the toggle at the right, tight over the first repo's section */
  :is(#card, #dock) .phead.top .n { margin-right: var(--space-1-5); font-size: var(--text-xs); color: var(--ink-dim); }
  :is(#card, #dock) .phead.top > .n { margin: 0 0 0 auto; } /* the card has no toggle to push it: at the right edge, like the counts below */
  :is(#card, #dock) .tray > .phead.top + .phead { margin-top: var(--space-1); }
  /* the toggle's zone is the rest of the PR header row after the summary, its full height and out to the tray's edge,
     with the icon at its right end */
  :is(#card, #dock) .tog { flex: 1 0 auto; align-self: stretch; display: flex; align-items: center; justify-content: flex-end; color: var(--accent-violet); margin-right: calc(-1 * var(--space-3)); padding: 0 var(--space-3) 0 var(--space-1-5); }
  :is(#card, #dock) .tog[aria-expanded=true] svg { transform: rotate(180deg); }
  :is(#card, #dock) .tog:hover { color: var(--ink-hover); }
  :is(#card, #dock) .tog:focus-visible { outline: 1px solid var(--focus); outline-offset: -2px; border-radius: var(--radius-sm); }
  /* the gaps between chips are the chips': half each, so they touch */
  :is(#card, #dock) .chips { display: flex; flex-wrap: wrap; margin: var(--space-0-5) calc(-1 * var(--space-0-5)) 0; }
  :is(#card, #dock) .chips a { padding: var(--space-0-5); }
  :is(#card, #dock) .chips .face { display: inline-flex; align-items: center; gap: var(--space-1); border: 1px solid var(--line-soft); background: var(--surface-raised); border-radius: var(--radius-pill); padding: 0 var(--space-2) 0 var(--space-1-5); font-size: var(--text-xs); color: var(--ink); }
  :is(#card, #dock) .chips a:hover .face { border-color: var(--accent-violet-line); color: var(--ink-strong); }
  :is(#card, #dock) :is(.chips, .me) i { flex: none; width: 6px; height: 6px; border-radius: 50%; }
  /* a listed PR's zone is its whole row, out to the tray's edges; half the gap between rows is each row's */
  :is(#card, #dock) a.pr2 { display: block; width: calc(100% + 2 * var(--space-3)); margin: 0 calc(-1 * var(--space-3)); padding: calc(var(--space-0-5) / 2) var(--space-1-5); }
  :is(#card, #dock) .phead + a.pr2 { margin-top: var(--space-0-5); }
  :is(#card, #dock) a.pr2 .face { padding: var(--space-1) var(--space-1-5); }
  :is(#card, #dock) :is(a.pr2, .chips a) { border: none; } /* the card's link underline is on a face, where there is one */
  :is(#card, #dock) a.pr2:hover .face { background: color-mix(in srgb, var(--accent-violet) 10%, transparent); }
  :is(#card, #dock) .pr2 .ti { display: block; color: var(--ink-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  :is(#card, #dock) .pr2 .me { display: flex; gap: var(--space-1-5); align-items: center; margin-top: var(--space-1); font-size: var(--text-xs); color: var(--ink-dim); }
  :is(#card, #dock) .pr2 .me .t { margin-left: auto; font-family: var(--font-mono); font-variant-numeric: tabular-nums; } /* like an agent's time */
  :is(#card, #dock) .pr2 .me b { color: var(--accent-violet); font-weight: var(--weight-regular); }
  :is(#card, #dock) .more { font-size: var(--text-xs); color: var(--ink-dim); padding-top: var(--space-0-5); }
  #card button.more { display: block; width: 100%; } /* the agents' "n more": its zone is the band's width */
  #card button.more .face { padding: var(--space-0-5) var(--space-1-5); }
  #card button.more:hover .face { color: var(--ink-hover); background: color-mix(in srgb, var(--accent-violet) 8%, transparent); }
  /* The pin: a third header button after the pill. Its zone runs from the pill to the header's right edge, the header's
     full height; its .face is the bare icon, faint at rest and the accent while pinned. */
  :is(#card, #dock) h3 .chip:has(+ .pin) { padding-right: 0; }
  :is(#card, #dock) h3 .pin { flex: none; display: flex; align-items: flex-start; padding: var(--space-3) var(--space-3) 0 var(--space-2); }
  :is(#card, #dock) .pin .face { display: flex; margin-top: var(--space-0-5); color: var(--ink-faint); }
  :is(#card, #dock) .pin.on .face { color: var(--accent); }
  :is(#card, #dock) .pin:hover .face { color: var(--ink-hover); }
  /* The pinned sidebar (src/components/PinnedDock.vue): a column right of the scene, opening as the scene narrows, with one
     section per pinned session, scrolling as a whole. A section is a card's body without the card: the same padding, so
     the shared header and tray rules fit it. Its content keeps its full width while the column slides, so nothing
     reflows. Nothing is cut short in it. */
  #dock { grid-row: 1; grid-column: 2; width: 0; overflow: hidden; background: var(--night); /* the footer's (body's), so the two read as one chrome */
    color: var(--ink); font-size: var(--text-sm); line-height: var(--leading); transition: width var(--slide); }
  .pinned #dock { width: var(--dock-width); }
  #dock .stack { width: var(--dock-width); height: 100%; overflow-y: auto; box-sizing: border-box; } /* the scroller, so its scrollbar is inside the column */
  #dock section { padding: var(--space-3); }
  #dock section + section { border-top: 1px solid var(--line); }
  #dock .tray { border-radius: 0; }
  #dock .pr2 .ti { white-space: normal; overflow-wrap: anywhere; } /* an agent's row is already open there */
  #dock .agent { box-sizing: border-box; } /* a plain row there, not a button, so it doesn't get the buttons' reset */
  #dock .ended > :not(h3), #dock .ended h3 :is(.open, .chip) { opacity: var(--faded); } /* its session has ended: as it last was, until unpinned */
  .moth .wing { fill: var(--wing); }
</style>
</head>
<body>
<div id="scene"><canvas id="bg"></canvas>
<svg viewBox="40 20 600 600" role="img" aria-label="Lantern: live status of Claude Code sessions">
  <g id="staleCloud" style="display: none"><circle r="16" fill="#C9C0DC" opacity="0.05"/><circle cx="-7" cy="3" r="9" fill="#C9C0DC" opacity="0.06"/><circle cx="8" cy="-2" r="8" fill="#C9C0DC" opacity="0.06"/><text id="staleCloudCount" y="3" text-anchor="middle" font-size="7" fill="#8F7FA6"></text></g>
  <g id="threads" fill="none" stroke-width="1.5" stroke-dasharray="3 6"></g>
</svg>
<svg id="lanternBack" class="lanternLayer" aria-hidden="true">
  <defs>
    <radialGradient id="paperGrad" cx="340" cy="350" r="140" gradientUnits="userSpaceOnUse">
      <stop class="paperStop" offset="0" stop-opacity="0.85"/>
      <stop class="paperStop" offset="1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paperShade" x1="280" x2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CFB28C"/><stop offset=".28" stop-color="#F0D9BC"/><stop offset=".5" stop-color="#F8E8D2"/>
      <stop offset=".72" stop-color="#F0D9BC"/><stop offset="1" stop-color="#C9AA84"/>
    </linearGradient>
  </defs>

<canvas id="pagesInk" aria-hidden="true"></canvas><!-- the session text on the paper, over the back paper (pages.ts) -->

<svg aria-hidden="true">

  </div>
